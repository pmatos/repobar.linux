name: Linux build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: swift build (${{ matrix.leg }})
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: ubuntu-22.04
            runs-on: ubuntu-22.04
            container: ''
          - leg: ubuntu-24.04
            runs-on: ubuntu-24.04
            container: ''
          - leg: arch
            runs-on: ubuntu-latest
            container: archlinux:latest

    steps:
      # The apt/pacman lists below intentionally mirror what
      # Scripts/install-toolchain.sh installs, plus the GTK3 +
      # libayatana-appindicator3 dev headers that RepoBarGtk needs at link
      # time. We then run the toolchain script with SWIFT_INSTALL_SKIP_DEPS=1
      # so it only handles the Swift tarball + Arch shims and doesn't try to
      # re-shell out to a package manager (which on Ubuntu native runners
      # would require sudo plumbing).
      - name: Install system dependencies (apt)
        if: ${{ matrix.container == '' }}
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils ca-certificates curl git gnupg libcurl4 libedit2 libncurses6 \
            libpython3-dev libsqlite3-0 libxml2 libz3-dev pkg-config tzdata unzip \
            zlib1g-dev libgtk-3-dev libayatana-appindicator3-dev
          if grep -q '22.04' /etc/os-release; then
            sudo apt-get install -y --no-install-recommends libgcc-11-dev libstdc++-11-dev
          else
            sudo apt-get install -y --no-install-recommends libgcc-13-dev libstdc++-13-dev
          fi

      - name: Install system dependencies (pacman)
        if: ${{ matrix.container != '' }}
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel ca-certificates curl gcc git icu libedit libxml2 ncurses \
            python sqlite tar unzip zlib libayatana-appindicator gtk3

      - name: Checkout (with submodule)
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install Swift 6.2 (skip-deps, deps already handled above)
        env:
          SWIFT_INSTALL_SKIP_DEPS: '1'
        run: ./Scripts/install-toolchain.sh

      - name: Set up Swift on PATH
        run: |
          echo "$HOME/.swift/swift-6.2-RELEASE/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.swift/swift-6.2-RELEASE/usr/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: swift --version

      - name: Build RepoBarGtk (transitively builds RepoBarCore)
        run: swift build --product RepoBarGtk

      - name: Build repobarcli from the pinned submodule
        run: swift build --package-path repobar --product repobarcli

      - name: Run swift test (RepoBarGtkTests)
        run: swift test

      - name: Sanity-check the CLI binary
        run: ./repobar/.build/debug/repobarcli --help | head -1

      # Per the issue's acceptance criteria, upload the RepoBarGtk binary so
      # users / packagers can grab a known-good debug build off the run page.
      # ubuntu-24.04 is the target distro most people are on right now, so we
      # publish from that leg.
      - name: Upload RepoBarGtk binary
        if: matrix.leg == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: RepoBarGtk-debug-ubuntu-24.04
          path: .build/debug/RepoBarGtk
          if-no-files-found: error
          retention-days: 14
